################################################################################
## glow_waveforms.glow_bilby: lensed injection / recovery with bilby_pipe
## Filled in by make_ini.py; {{placeholders}} are replaced there.
################################################################################

label = {label}
outdir = {outdir}
accounting = {accounting}
generation-pool = local
# write outputs (checkpoint plots, resume files) directly to the shared filesystem
transfer-files = False

################################################################################
## Data and detectors (zero-noise injection, bilby default PSDs)
################################################################################
detectors = {detectors}
duration = {duration}
post-trigger-duration = {post_trigger_duration}
sampling-frequency = {sampling_frequency}
minimum-frequency = 20
maximum-frequency = {maximum_frequency}
reference-frequency = 20
trigger-time = {trigger_time}
zero-noise = True
gaussian-noise = False

################################################################################
## Injection: lensed with the injection model
################################################################################
injection = True
injection-dict = {injection_dict}
injection-frequency-domain-source-model = {injection_source_model}
injection-waveform-approximant = {approximant}

################################################################################
## Recovery model: prior file + source model (change both, and label/outdir)
################################################################################
prior-file = {prior_file}
frequency-domain-source-model = {source_model}
{other_recoveries}
default-prior = glow_waveforms.glow_bilby.bilby_pe.priors.LensedBBHPriorDict
deltaT = 0.2
waveform-approximant = {approximant}
conversion-function = glow_waveforms.glow_bilby.bilby_pe.priors.convert_to_lensed_bbh_parameters
generation-function = bilby.gw.conversion.generate_all_bbh_parameters
catch-waveform-errors = True

################################################################################
## Likelihood
################################################################################
likelihood-type = GravitationalWaveTransient
distance-marginalization = {distance_marginalization}
phase-marginalization = False
time-marginalization = {time_marginalization}
calibration-model = None

################################################################################
## Sampler (same settings as run_bilby.py)
################################################################################
sampler = dynesty
sampler-kwargs = {{nlive: {nlive}, naccept: {naccept}, sample: acceptance-walk, check_point_delta_t: 1800}}
n-parallel = 1
request-cpus = {request_cpus}

################################################################################
## Post-processing
################################################################################
plot-corner = True
plot-waveform = True
create-summary = False
