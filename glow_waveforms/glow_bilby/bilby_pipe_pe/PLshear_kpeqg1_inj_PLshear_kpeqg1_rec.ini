################################################################################
## glow_waveforms.glow_bilby: lensed injection / recovery with bilby_pipe
## Filled in by make_ini.py; {placeholders} are replaced there.
## Example: prior-file paths are relative to this directory, so run bilby_pipe
## from here. (make_ini.py writes absolute paths.)
################################################################################

label = PLshear_kpeqg1_inj_PLshear_kpeqg1_rec
outdir = outdir_PLshear_kpeqg1_inj_PLshear_kpeqg1_rec
accounting = ligo.dev.o4.cbc.lensing.multi
generation-pool = local
# write outputs (checkpoint plots, resume files) directly to the shared filesystem
transfer-files = False

################################################################################
## Data and detectors (zero-noise injection, bilby default PSDs)
################################################################################
detectors = [H1, L1, V1]
duration = 4.0
post-trigger-duration = 2.0
sampling-frequency = 2048.0
minimum-frequency = 20
maximum-frequency = 1024.0
reference-frequency = 20
trigger-time = 1126259642.413
zero-noise = True
gaussian-noise = False

################################################################################
## Injection: lensed with the injection model
################################################################################
injection = True
injection-dict = {'mass_1': 35.0, 'mass_2': 30.0, 'a_1': 0.42, 'a_2': 0.1, 'tilt_1': 1.3, 'tilt_2': 1.3, 'phi_12': 1.7, 'phi_jl': 0.3, 'luminosity_distance': 4571.717354476289, 'theta_jn': 0.4, 'phase': 1.3, 'ra': 1.375, 'dec': 1.12108, 'psi': 2.659, 'geocent_time': 1126259642.413, 'MLz': 1000.0, 'psi0': 1.0, 'y': 1.2, 'theta': 0.2, 'g1': 0.4, 'g2': 0.0}
injection-frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_PLshear_kpeqg1
injection-waveform-approximant = IMRPhenomXPNR

################################################################################
## Recovery model: prior file + source model (change both, and label/outdir)
################################################################################
prior-file = prior_files/PLshear_kpeqg1.prior
frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_PLshear_kpeqg1
## other recovery models:
# prior-file = prior_files/UL.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.unlensed_binary_black_hole
# prior-file = prior_files/PL.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_PL
# prior-file = prior_files/SIS.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_SIS
# prior-file = prior_files/gSIS.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_gSIS
# prior-file = prior_files/NFW.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_NFW
# prior-file = prior_files/PLshear.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_PLshear
# prior-file = prior_files/gSISshear.prior
# frequency-domain-source-model = glow_waveforms.glow_bilby.source.lensed_binary_black_hole_gSISshear
default-prior = glow_waveforms.glow_bilby.bilby_pe.priors.LensedBBHPriorDict
deltaT = 0.2
waveform-approximant = IMRPhenomXPNR
conversion-function = glow_waveforms.glow_bilby.bilby_pe.priors.convert_to_lensed_bbh_parameters
generation-function = bilby.gw.conversion.generate_all_bbh_parameters
catch-waveform-errors = True

################################################################################
## Likelihood
################################################################################
likelihood-type = GravitationalWaveTransient
distance-marginalization = False
phase-marginalization = False
time-marginalization = False
calibration-model = None

################################################################################
## Sampler (same settings as run_bilby.py)
################################################################################
sampler = dynesty
sampler-kwargs = {nlive: 1000, naccept: 60, sample: acceptance-walk, check_point_delta_t: 1800}
n-parallel = 1
request-cpus = 16

################################################################################
## Post-processing
################################################################################
plot-corner = True
plot-waveform = True
create-summary = False
